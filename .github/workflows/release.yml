# ----------------------------------------------------------------------
# Release – triggered by pushing a tag that starts with 'v' (e.g. v0.1.0).
# Builds and tests on Ubuntu & macOS, then creates a GitHub Release
# with ZIP archives containing the static library and the public header.
# The release description is taken from the file release.md at the root.
# ----------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static library
        run: make

      - name: Run test suite
        run: make test

      - name: Prepare artifact (library + header)
        run: |
          mkdir -p artifact
          cp libcagekeygen.a artifact/
          cp include/libcagekeygen.h artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcagekeygen-${{ matrix.os }}
          path: artifact/

  # ----------------------------------------------------------------
  # Release job – aggregates artifacts and publishes the release
  # ----------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for creating a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # We need the checkout to access release.md (the release notes)

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded structure
        run: ls -R

      - name: Package each platform into a ZIP archive
        run: |
          for dir in libcagekeygen-*; do
            if [ -d "$dir" ]; then
              echo "Packaging $dir..."
              (cd "$dir" && zip -r "../${dir}.zip" .)
            fi
          done
          ls -lh *.zip

      - name: Generate SHA256 checksums
        run: |
          rm -f SHA256SUMS
          for zipfile in libcagekeygen-*.zip; do
            if [ -f "$zipfile" ]; then
              sha256sum "$zipfile" >> SHA256SUMS
            fi
          done
          echo "Checksums:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: "libcagekeygen-*.zip,SHA256SUMS"
          # The release description is read from a dedicated file
          bodyFile: release.md
          # If release.md does not exist, provide a minimal fallback
          body: |
            ## libcagekeygen ${{ github.ref_name }}

            Pre-built static library and public header for Linux and macOS.
            See `SHA256SUMS` for integrity verification.
